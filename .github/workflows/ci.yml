name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    env:
      # 新布局：应用代码在 backend/，测试从仓库根调用
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
        with:
          # 脱敏审计要扫全历史，必须取完整历史（默认只取最后一次提交）
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 冒烟测试（强制 mock 离线，含故障注入/OCR/加密/缓存/对抗样本）
        run: python tests/test_smoke.py
      - name: 结构化校验测试（规划/ReAct 决策的 Pydantic 边界与降级）
        run: python tests/test_schemas.py
      - name: 后端导入自检（配置层 + LangGraph 编排层）
        run: |
          python -c "from config import load_config; from core.agent import JobAgent; print('backend import ok')"
          python -c "import core.graph; print('graph module ok')"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 生产构建
        run: npm run build

  ui:
    name: 交互层实机校验
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装后端依赖与 Playwright
        run: |
          pip install -r backend/requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建前端产物
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
      - name: 启动后端并等待健康检查
        run: |
          python -m uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health > /dev/null
      - name: 端到端接口冒烟
        run: python scripts/smoke_api.py
      - name: 交互层实机校验（真实点击 + 网络断言）
        run: python scripts/ui_check.py

  postgres:
    name: PostgreSQL 路径
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      LLM_PROVIDER: mock
      # 一次性 CI 库：凭据是**字面占位符**（user/password），只存在于本次作业的
      # 临时服务容器内，作业结束即销毁；因此可安全写在仓库里，也落在脱敏审计白名单内。
      DATABASE_URL: postgresql+psycopg://user:password@127.0.0.1:5432/pathforge_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pathforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d pathforge_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖（含 PostgreSQL 驱动）
        run: pip install -r backend/requirements.txt -r backend/requirements-postgres.txt
      - name: 方言级校验（JSONB / 时区列 / 索引）
        run: python scripts/check_postgres_path.py
      - name: 真实实例端到端（建表 + 契约端点 + SSE 全链路）
        # --use-env-db：不再把连接串覆盖成临时 SQLite，本次真正跑在 PostgreSQL 上
        run: python scripts/smoke_api.py --use-env-db

  audit:
    name: 脱敏审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 密钥 / 私有端点 / 个人敏感信息（含全历史）
        run: python scripts/audit_secrets.py --repo .
      - name: 第三方品牌名称扫描（界面与文案原创性）
        # 只扫工作树：重构前的历史提交（v1 单体版本）里存在厂商名，
        # 那属于历史事实、不影响当前发布内容；密钥审计才需要覆盖历史。
        run: python scripts/audit_brand.py --repo .
