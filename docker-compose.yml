# ============================================================================
# 拓径 PATHFORGE — 本地一键起（后端 + PostgreSQL + Redis）
# 用法：
#   cp backend/.env.example .env    # 按需修改连接串
#   docker compose up -d --build
#   打开 http://127.0.0.1:8000
# 说明：compose 里的凭据仅用于本地开发，请勿直接用于生产；生产请用密钥管理服务注入。
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathforge
      POSTGRES_PASSWORD: pathforge_local_dev
      POSTGRES_DB: pathforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathforge -d pathforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DATABASE_URL: postgresql+psycopg://pathforge:pathforge_local_dev@db:5432/pathforge
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_PATH: /app/data/vectors
      WORKSPACE_ROOT: /app/workspaces
      # LLM 凭据从宿主机 .env 注入，镜像内不含任何密钥
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      DATA_KEY: ${DATA_KEY:-}
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
